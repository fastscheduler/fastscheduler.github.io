<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>.fsback vs .fspback</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;overflow:hidden}body{display:grid;place-items:center;font-family:Inter,system-ui,sans-serif}
#stage{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;overflow:hidden;color:#fff;background:linear-gradient(175deg,#0b211d 0%,#07181c 60%,#040e14 100%);cursor:pointer;container-type:size}
#bg{position:absolute;inset:0;background:radial-gradient(60cqw 36cqw at 50% 0%,#2fd08a17,transparent 65%);transition:filter .18s}
/* beat flash removed: full-frame flicker every 1.1s looked glitchy */
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff07 1px,transparent 1px) 0 0/10cqw 10cqw,linear-gradient(90deg,#ffffff07 1px,transparent 1px) 0 0/10cqw 10cqw}
#progress{position:absolute;top:0;left:0;right:0;height:1.1cqw;background:#ffffff1a;z-index:30}
#pfill{height:100%;width:0%;background:#2fd08a;transition:width .12s linear}
/* tap hint deleted */
.doc{width:52cqw;background:linear-gradient(160deg,#ffffff,#d7e0ea);border-radius:3cqw 9cqw 3cqw 3cqw;color:#0b1b3b;padding:3.6cqw;text-align:left;box-shadow:0 4cqw 10cqw #000a;animation:drop .55s cubic-bezier(.2,1.2,.3,1) both;transition:background .5s,color .5s,border .5s}
.doc.mini{width:34cqw}
.doc .ext{font-weight:900;font-size:4.4cqw}
.doc.amber .ext{color:#c26f00}
.doc .dr{font-family:'JetBrains Mono',monospace;font-size:2.9cqw;font-weight:700;background:#0b1b3b0d;border-radius:2cqw;padding:1.5cqw 2cqw;margin-top:1.5cqw;white-space:nowrap;overflow:hidden;animation:drin .45s cubic-bezier(.2,.9,.2,1) both}
.doc .dr:nth-child(2){animation-delay:.3s}.doc .dr:nth-child(3){animation-delay:.42s}.doc .dr:nth-child(4){animation-delay:.54s}.doc .dr:nth-child(5){animation-delay:.66s}
@keyframes drin{from{opacity:0;transform:translateX(-4cqw)}}
#pw .caret{display:inline-block;width:.6cqw;height:5cqw;background:#2fd08a;vertical-align:-.6cqw;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#pw .dot{display:inline-block;animation:dotin .3s ease-out}
@keyframes dotin{from{opacity:0;transform:translateY(1.2cqw)}to{opacity:1;transform:none}}
.card.late,.chip.late{animation:latepop .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes latepop{from{opacity:0;transform:scale(.5) translateY(3cqw)}}
.doc.locked{background:linear-gradient(160deg,#0e3d2f,#071d16);color:#2fd08a;border:.4cqw solid #2fd08a}
.doc.locked .ext{color:#2fd08a}
.doc.locked .dr{background:#2fd08a14}
#cap{position:absolute;left:4cqw;right:4cqw;bottom:5cqw;z-index:20;text-align:center;min-height:15cqw;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none}
#cap.on{opacity:1}
#cap .w{display:inline-block;font-size:9.5cqw;font-weight:900;letter-spacing:-.02em;color:#fff;text-transform:uppercase;text-shadow:-.5cqw 0 0 #000,.5cqw 0 0 #000,0 .8cqw 0 #000,0 0 5cqw #000;animation:wpop .22s cubic-bezier(.2,1.4,.4,1) both}
#cap .w.hot{color:#2fd08a}
#cap .w.warm{color:#ffb020}
@keyframes wpop{from{opacity:0;transform:scale(.6) rotate(-4deg)}to{opacity:1;transform:scale(1)}}
/* thump removed: re-triggering it restarted entrance animations and made elements jump */
.s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;opacity:0;transition:opacity .38s;padding:0 7cqw;text-align:center}
.s.on{opacity:1;animation:drift 2.4s ease-out both}
.s.out{opacity:0;animation:none;transform:translateY(-2cqw) scale(1.04);filter:blur(1.2cqw);transition:all .4s}
@keyframes drift{from{transform:scale(.985)}to{transform:scale(1.03)}}
/* editorial tags + headlines */
.tag{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:3.2cqw;font-weight:700;letter-spacing:.28em;color:#2fd08a;animation:up .4s both}
.tag.amber{color:#ffb020}.tag.red{color:#ff5d6c}
.rule{width:14cqw;height:.7cqw;border-radius:1cqw;background:currentColor;opacity:.5;animation:rule .5s ease-out both}
@keyframes rule{from{transform:scaleX(0)}}
.k{font-size:10.5cqw;font-weight:900;letter-spacing:-.03em;line-height:1.06}
.k span{display:inline-block;margin:0 1.2cqw;animation:kw .4s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*.05s)}
.k.sm{font-size:7.2cqw}
@keyframes kw{from{opacity:0;transform:translateY(5cqw)}}
@keyframes up{from{opacity:0;transform:translateY(5cqw)}}
@keyframes pp{from{opacity:0;transform:scale(.65)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes drop{from{opacity:0;transform:translateY(-40cqw) rotate(-6deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes floaty{from{transform:translateY(-1cqw) rotate(var(--r,0deg))}to{transform:translateY(1.2cqw) rotate(var(--r,0deg))}}
@keyframes dashmove{to{stroke-dashoffset:-13}}
@keyframes alertpulse{0%,100%{box-shadow:0 0 0 0 #ff5d6c66}50%{box-shadow:0 0 0 3cqw #ff5d6c00}}
.am{color:#ffb020}.gr{color:#2fd08a}.wh{color:#fff}.dim{color:#ffffffb0}.rd{color:#ff5d6c}
.row{display:flex;align-items:center;justify-content:center;gap:3cqw}
.f{width:30cqw;--r:0deg;filter:drop-shadow(0 3cqw 5cqw #0009);animation:drop .55s cubic-bezier(.2,1.2,.3,1) both,floaty 2.4s .7s ease-in-out infinite alternate}
.f.l{--r:-7deg}.f.big{width:38cqw}
.arrv{width:22cqw;height:10cqw;overflow:visible;flex:none;color:#2fd08a}
.arrv.amber{color:#ffb020}
.arrv.red{color:#ff5d6c}
.arrv .halo{fill:none;stroke:currentColor;opacity:.16;stroke-width:12;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .55s ease-in-out forwards;animation-delay:var(--d,.3s)}
.arrv .shaft{fill:none;stroke:url(#ag);stroke-width:6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .55s ease-in-out forwards;animation-delay:var(--d,.3s)}
.arrv .head{fill:none;stroke:#2fd08a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:center;animation:headin .35s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(var(--d,.3s) + .5s)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes headin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.arrv.amber .shaft{stroke:url(#aa)}
.arrv.amber .head{stroke:#ffb020}
.arrv.red .shaft{stroke:url(#ar)}
.arrv.red .head{stroke:#ff5d6c}
.vs{font-weight:900;font-size:5.5cqw;width:12cqw;height:12cqw;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b1b3b;animation:pp .4s .5s cubic-bezier(.2,1.5,.4,1) both,pulse 1.4s 1s infinite}
.ic{width:1.2em;height:1.2em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:#ffffff0d;border:.3cqw solid #ffffff2e;border-radius:4cqw;padding:3.4cqw 5cqw;font-weight:700;font-size:4.2cqw;line-height:1.4;animation:up .4s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--d,0s);max-width:80cqw}
.badge{display:flex;align-items:center;gap:2cqw;padding:2.6cqw 5cqw;border-radius:8cqw;font-weight:800;font-size:4.6cqw;animation:pp .4s cubic-bezier(.2,1.5,.4,1) both,pulse 1.5s 1s infinite;animation-delay:var(--d,0s),1s}
.badge.a{background:#ffb020;color:#2b1a00}.badge.g{background:#2fd08a;color:#032a1a}.badge.r{background:#ff5d6c;color:#fff;animation:pp .4s both,alertpulse 1.4s .6s infinite}
.badge.big{font-size:5.6cqw;padding:3cqw 6cqw}
.alert{width:26cqw;height:26cqw;border-radius:50%;background:#ff5d6c1a;border:.6cqw solid #ff5d6c;display:grid;place-items:center;color:#ff5d6c;animation:pp .45s cubic-bezier(.2,1.4,.4,1) both,alertpulse 1.4s .6s infinite}
.alert .ic{width:13cqw;height:13cqw}
/* comparison table */
.tbl{width:82cqw;border-radius:4cqw;overflow:hidden;border:.3cqw solid #ffffff2e;font-size:3.9cqw;font-weight:700}
.tbl .tr{display:flex;animation:up .4s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--d,0s)}
.tbl .tr+.tr{border-top:.3cqw solid #ffffff1c}
.tbl .th{background:#ffffff10;color:#ffffffb0;font-family:'JetBrains Mono',monospace;font-size:3cqw;letter-spacing:.14em}
.tbl .td{flex:1;padding:2.4cqw 1cqw;display:flex;align-items:center;justify-content:center;gap:1.4cqw}
.tbl .td:first-child{flex:1.1;background:#ffffff08}
.tbl .yes{color:#2fd08a}.tbl .no{color:#ffb020}.tbl .ic{width:5cqw;height:5cqw}
.dlg{width:72cqw;background:#fff;color:#0b1b3b;border-radius:4cqw;padding:4cqw;display:flex;flex-direction:column;gap:2.2cqw;font-weight:700;font-size:4cqw;box-shadow:0 4cqw 10cqw #0008;animation:pp .4s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d,0s);text-align:left}
.dlg i{font-style:normal;font-size:6cqw;letter-spacing:.5cqw;min-height:7cqw;border-bottom:.4cqw solid #2fd08a}
.dlg small{color:#5b6b85;font-weight:600}
.dlg.typing{box-shadow:0 4cqw 10cqw #0008,0 0 7cqw #2fd08a77}
.ch{width:84cqw;max-height:104cqw;background:#0e1621;border-radius:5cqw;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5cqw 12cqw #000a,0 0 0 .5cqw #ffffff22;font-size:3.6cqw;animation:pp .4s both;text-align:left}
.chh{display:flex;align-items:center;gap:2cqw;padding:2.6cqw 3.4cqw;background:#17212b}
.chh img{width:8cqw;height:8cqw;border-radius:50%}
.tglogo{width:8cqw;height:8cqw;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.tglogo svg{width:8cqw;height:8cqw;display:block}
.chh small{color:#7f91a4;margin-left:1cqw}
.cm{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1.8cqw;padding:3cqw;overflow:hidden}
.bm{max-width:88%;padding:2cqw 3cqw;border-radius:3.4cqw;line-height:1.35;animation:up .3s cubic-bezier(.2,.9,.2,1) both}
.bm.in{background:#182533;align-self:flex-start}.bm.out{background:#2b5278;align-self:flex-end}
.bm .fl2{display:flex;align-items:center;gap:2cqw;font-weight:800}
.bm .fl2 svg{width:9cqw}
.kr{display:flex;gap:1.4cqw;margin-top:1.8cqw}
.bb{flex:1;text-align:center;padding:2cqw 1cqw;border-radius:2.4cqw;background:#2e3f52;font-weight:700}
.bb.pr{background:#3a96e2;transform:scale(1.05)}
.tp{position:absolute;z-index:9;width:11cqw;height:11cqw;margin:-5.5cqw;border-radius:50%;border:.5cqw solid #fff;animation:tp .8s ease-out forwards;pointer-events:none}
@keyframes tp{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(2)}}
.cta{color:#032a1a;background:#2fd08a;border-radius:9cqw;padding:3cqw 8cqw;font-weight:800;font-size:5cqw;text-decoration:none;animation:pp .5s .7s both,pulse 1.5s 1.4s infinite}
